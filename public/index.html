<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPulse mini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>PetPulse mini</h1>

        <section>
            <h2>Питомцы</h2>
            <ul id="pets-list"></ul>

            <h3>Добавить питомца</h3>
            <form id="pet-form">
                <input id="name" placeholder="Кличка" required>
                <input id="species" placeholder="Вид (кошка, собака...)" required>
                <input id="breed" placeholder="Порода">
                <input id="birthDate" type="date">
                <button type="submit">Добавить</button>
            </form>
        </section>

        <section>
            <h2>Ветеринарные врачи</h2>
            <select id="vet-filter">
                <option value="">Все специализации</option>
                <option value="терапевт">Терапевт</option>
                <option value="хирург">Хирург</option>
                <option value="дерматолог">Дерматолог</option>
            </select>
            <ul id="vets-list"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
