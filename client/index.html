<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPulse mini</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🐾 PetPulse mini</h1>
        <p>Учёт питомцев и каталог ветеринарных врачей</p>
    </header>

    <main>
        <section>
            <h2>Питомцы</h2>
            <ul id="pets-list"></ul>
        </section>

        <section>
            <h2 id="form-title">Добавить питомца</h2>
            <form id="pet-form">
                <input id="name" placeholder="Кличка" required>
                <input id="species" placeholder="Вид (кошка, собака...)" required>
                <input id="breed" placeholder="Порода">
                <input id="birthDate" type="date">
                <div class="form-buttons">
                    <button type="submit" id="submit-button" class="primary">Добавить</button>
                    <button type="button" id="cancel-button" hidden>Отмена</button>
                </div>
            </form>
        </section>

        <section>
            <div class="section-header">
                <h2>Ветеринарные врачи</h2>
                <select id="vet-filter">
                    <option value="">Все специализации</option>
                    <option value="терапевт">Терапевт</option>
                    <option value="хирург">Хирург</option>
                    <option value="дерматолог">Дерматолог</option>
                </select>
            </div>
            <ul id="vets-list"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
